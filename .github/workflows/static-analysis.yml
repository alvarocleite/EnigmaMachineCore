name: Static Analysis

on:
  workflow_call:

jobs:
  clang-tidy:
    name: Clang-Tidy Analysis
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-tidy

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Debug -DENIGMA_ENABLE_CLANG_TIDY=ON

    - name: Run Analysis
      # Building the target triggers clang-tidy as configured in CMakeLists.txt
      run: cmake --build ${{github.workspace}}/build 2>&1 | tee static-analysis.log

    - name: Generate Summary
      if: always()
      run: |
        echo "## Clang-Tidy Analysis Summary" >> $GITHUB_STEP_SUMMARY
        
        # Count total warnings (lines containing ": warning:")
        TOTAL_WARNINGS=$(grep -c ": warning:" static-analysis.log || echo 0)
        echo "**Total Warnings:** $TOTAL_WARNINGS" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "$TOTAL_WARNINGS" -gt 0 ]; then
          echo "| Warning Type | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          
          # Extract warning types (text in [brackets] at end of warning lines)
          # Sort and count unique occurrences
          grep ": warning:" static-analysis.log | sed -n 's/.*\[\(.*\)\].*/\1/p' | sort | uniq -c | sort -nr | while read count type; do
            echo "| \`$type\` | $count |" >> $GITHUB_STEP_SUMMARY
          done
        else
          echo "✅ No warnings found!" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Analysis Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: static-analysis-log
        path: static-analysis.log

  cppcheck:
    name: CppCheck Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install CppCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Debug -DENIGMA_ENABLE_CPPCHECK=ON

    - name: Run CppCheck
      run: cmake --build ${{github.workspace}}/build --target enigma_cppcheck 2>&1 | tee cppcheck.log

    - name: Generate Summary
      if: always()
      run: |
        echo "## CppCheck Analysis Summary" >> $GITHUB_STEP_SUMMARY
        
        # CppCheck output for errors/warnings typically contains [style], [performance], etc.
        TOTAL_ISSUES=$(grep -c "\[" cppcheck.log || echo 0)
        echo "**Total Issues Found:** $TOTAL_ISSUES" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "$TOTAL_ISSUES" -gt 0 ]; then
          echo "| Issue Type | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          
          # Extract the category in brackets (e.g., [style], [performance])
          # The pattern is usually like: [file:line]: (style) message [id]
          # Or similar. Let's try to extract the (category) or [id]
          grep -o "(\(style\|performance\|portability\|warning\|error\))" cppcheck.log | tr -d '()' | sort | uniq -c | sort -nr | while read count type; do
            echo "| \`$type\` | $count |" >> $GITHUB_STEP_SUMMARY
          done
        else
          echo "✅ No CppCheck issues found!" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload CppCheck Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck-log
        path: cppcheck.log
