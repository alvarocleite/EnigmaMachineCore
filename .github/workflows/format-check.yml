name: Clang-Format Check

on:
  pull_request:
    branches: [ "main", "development" ]

jobs:
  format-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format
      run: |
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo apt-add-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
        sudo apt-get update
        sudo apt-get install -y clang-format-21

    - name: Run clang-format
      run: |
        # Find all source files excluding external/ and build/
        # Matches the patterns in CMakeLists.txt
        find EnigmaMachine PlugBoard RotorBox config tests app -name '*.cpp' -o -name '*.hpp' | xargs clang-format-21 -i -style=file

    - name: Check for changes
      run: |
        if ! git diff --exit-code; then
          git diff > format_fixes.patch
          exit 1
        fi

    - name: Upload Format Patch
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: format-fixes
        path: format_fixes.patch
