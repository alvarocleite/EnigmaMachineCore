name: Benchmarks

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  benchmark:
    name: Ubuntu - Release - Benchmarks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: |
        cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=Release \
          -DENIGMA_BUILD_BENCHMARKS=ON \
          -DENIGMA_BUILD_TESTS=OFF \
          -DENIGMA_BUILD_CLI=OFF

    - name: Build Benchmark
      run: cmake --build ${{github.workspace}}/build --target EnigmaBenchmark --config Release

    - name: Run Benchmark
      working-directory: ${{github.workspace}}/build/benchmarks
      run: ./EnigmaBenchmark --benchmark_format=console | tee benchmark_results.txt

    - name: Upload Benchmark Results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: ${{github.workspace}}/build/benchmarks/benchmark_results.txt
